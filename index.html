/* ============================== DATA CONTEXT (fetches /data/*.json) ============================== */
const DataContext = createContext(DEFAULTS);
function useSiteData() { return useContext(DataContext); }

function DataProvider({ children }) {
  const [data, setData] = useState(DEFAULTS);
  useEffect(() => {
    const files = {
      projects: "data/projects.json",
      caseStudies: "data/case-studies.json",
      testimonials: "data/testimonials.json",
      team: "data/team.json",
      blogPosts: "data/blog-posts.json",
      creatorGraphics: "data/creator-graphics.json",
      settings: "data/settings.json",
    };
    Object.entries(files).forEach(([key, path]) => {
      fetch(path + "?v=" + Date.now()).then(r => { if (!r.ok) throw new Error("not ok"); return r.json(); })
        .then(json => {
          setData(prev => ({ ...prev, [key]: json.items ? json.items : json }));
        })
        .catch(() => { /* keep default/fallback content — e.g. running from local disk */ });
    });
  }, []);
  return <DataContext.Provider value={data}>{children}</DataContext.Provider>;
}

function useHashRoute() {
  const [hash, setHash] = useState(window.location.hash || "#/");
  useEffect(() => {
    const onChange = () => setHash(window.location.hash || "#/");
    window.addEventListener("hashchange", onChange);

  }, []);

}
function useReveal(deps=[]) {
  const ref = useRef(null);
  useEffect(() => {
    const container = ref.current || document;
    const els = Array.from(container.querySelectorAll(".reveal, .reveal-left, .reveal-right"));
    if (els.length === 0) return;
    let ticking = false;
    function update() {
      const vh = window.innerHeight;
      const start = vh * 0.94;
      const end = vh * 0.5;
      els.forEach((el) => {
        const rect = el.getBoundingClientRect();
        let p = (start - rect.top) / (start - end);
        p = Math.max(0, Math.min(1, p));
        const eased = 1 - Math.pow(1 - p, 3);
        el.style.opacity = eased;
        if (el.classList.contains("reveal-left")) {
          el.style.transform = `translateX(${(1 - eased) * -34}px)`;
        } else if (el.classList.contains("reveal-right")) {
          el.style.transform = `translateX(${(1 - eased) * 34}px)`;
        } else {
          el.style.transform = `translateY(${(1 - eased) * 26}px) scale(${0.972 + eased * 0.028})`;
        }
      });
      ticking = false;
    }
    function onScroll() {
      if (!ticking) { window.requestAnimationFrame(update); ticking = true; }
    }
    update();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
    };
  }, deps);
  return ref;
}
function ParallaxLayer({ factor=0.15, className="", children }) {
  const ref = useRef(null);
  useEffect(() => {
    let ticking = false;
    function update() {
      const el = ref.current; if (!el) { ticking = false; return; }
      const rect = el.getBoundingClientRect();
      const offset = (window.innerHeight / 2 - (rect.top + rect.height / 2)) * factor;
      el.style.transform = `translate3d(0, ${offset}px, 0)`;
      ticking = false;
    }
    function onScroll() {
      if (!ticking) { window.requestAnimationFrame(update); ticking = true; }
    }
    update();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
    };
  }, [factor]);
  return <div ref={ref} className={className}>{children}</div>;
}
function ScrollProgressBar() {
  useEffect(() => {
    const bar = document.getElementById("scroll-progress-bar");
    let ticking = false;
    function update() {
      const doc = document.documentElement;
      const max = doc.scrollHeight - doc.clientHeight;
      const pct = max > 0 ? (window.scrollY / max) * 100 : 0;
      if (bar) bar.style.width = pct + "%";
      ticking = false;
    }
    function onScroll() {
      if (!ticking) { window.requestAnimationFrame(update); ticking = true; }
    }
    update();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => {
      window.removeEventListener("scroll", onScroll);
      window.removeEventListener("resize", onScroll);
    };
  }, []);
  return <div id="scroll-progress-bar"></div>;
}

function imgOrGradient(image, seedIndex) {
  const grads = [["#155EEF","#0A1B44"],["#5B9AFF","#0F2C74"],["#0B3FC4","#155EEF"],["#0F2C74","#5B9AFF"],["#155EEF","#050B24"],["#0B3FC4","#5B9AFF"]];
  const [c1,c2] = grads[seedIndex % grads.length];
  if (image) return { backgroundImage: `url(${image})`, backgroundSize:"cover", backgroundPosition:"center" };
  return { background: `linear-gradient(135deg, ${c1}, ${c2})` };
}

  if (href) return <a ref={ref} href={href} className={cls} onClick={onClick} {...handlers}>{children}</a>;

function TiltCard({ children, className="" }) {
  const ref = useRef(null);
  const [style, setStyle] = useState({ transform: "perspective(900px) rotateX(0deg) rotateY(0deg)" });
  function onMove(e) {
    const el = ref.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - 0.5;
    const py = (e.clientY - r.top) / r.height - 0.5;
    setStyle({ transform: `perspective(900px) rotateX(${(-py*7).toFixed(2)}deg) rotateY(${(px*9).toFixed(2)}deg)` });
  }
  function onLeave() { setStyle({ transform: "perspective(900px) rotateX(0deg) rotateY(0deg)" }); }
  return <div ref={ref} onMouseMove={onMove} onMouseLeave={onLeave} className={"tilt-card " + className} style={style}>{children}</div>;
}
function AnimatedNumber({ value }) {
  const ref = useRef(null);
  const [display, setDisplay] = useState(null);
  const match = typeof value === "string" ? value.match(/^(\d+)(.*)$/) : null;
  useEffect(() => {
    if (!match) { setDisplay(value); return; }
    const target = parseInt(match[1], 10);
    const suffix = match[2] || "";
    const el = ref.current;
    let started = false;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting && !started) {
          started = true;
          const duration = 1200;
          const startTime = performance.now();
          function tick(now) {
            const progress = Math.min(1, (now - startTime) / duration);
            const eased = 1 - Math.pow(1 - progress, 3);
            setDisplay(Math.round(eased * target) + suffix);
            if (progress < 1) requestAnimationFrame(tick);
          }
          requestAnimationFrame(tick);
        }
      });
    }, { threshold: 0.4 });
    if (el) io.observe(el);
    return () => io.disconnect();
  }, []);
  return <span ref={ref}>{display !== null ? display : value}</span>;
}

          <div className="reveal"><SectionHeading eyebrow="Difference" title="What makes us different" /></div>
          <div className="mt-12 grid sm:grid-cols-2 lg:grid-cols-4 gap-5">
            {[["target","Strategy"],["palette","Creativity"],["code","Technology"],["trend","Performance"]].map(([icon,label],i) => (
              <div key={label} className="reveal group bg-white rounded-2xl border border-line p-6 transition-all duration-300 hover:shadow-lg hover:shadow-blue/10 hover:-translate-y-1" style={{transitionDelay:(i*50)+"ms"}}>
                <span className="w-10 h-10 rounded-lg bg-gradient-to-br from-blue to-blue-deep text-white flex items-center justify-center shadow-lg shadow-blue/25 transition-transform duration-300 group-hover:scale-110 group-hover:rotate-6"><Icon name={icon} size={17} /></span>
                <p className="font-display text-[16px] font-semibold text-ink mt-4">{label}</p>
              </div>
            ))}
          </div>
        </div>
      </section>
      <section className="max-w-[1240px] mx-auto px-6 py-24">
        <div className="reveal"><SectionHeading eyebrow="Values" title="Our values" /></div>
        <div className="mt-10 flex flex-wrap gap-3">
          {["Creativity","Results","Transparency","Innovation","Growth"].map((v,i) => (
            <span key={v} className="reveal px-5 py-2.5 rounded-full border border-line bg-white text-[14px] text-ink/70 transition-all duration-300 hover:border-blue/40 hover:text-blue hover:-translate-y-0.5" style={{transitionDelay:(i*40)+"ms"}}>{v}</span>
          ))}
        </div>
      </section>
      <section className="bg-paper py-24">
        <div className="max-w-[1240px] mx-auto px-6">
          <div className="reveal"><SectionHeading eyebrow="Team" title="Our team" /></div>
          <div className="mt-12 grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
            {team.map((t,i) => (
              <div key={i} className="reveal text-center group" style={{transitionDelay:(i*50)+"ms"}}>
                <MediaBox image={t.photo} seedIndex={i} className="w-full aspect-square rounded-2xl mb-4 transition-transform duration-300 group-hover:scale-[1.03]" />
                <p className="text-[14.5px] font-medium text-ink">{t.name}</p>
                <p className="text-[12.5px] text-ink/45 mt-0.5">{t.role}</p>
              </div>
            ))}
          </div>
        </div>
      </section>
      <CTASection title="Let's build something great together." sub="Tell us about your business and where you want it to go." />
    </>
  );
}

/* ============================== PAGE: BLOG ============================== */
function BlogPage() {
  const [cat, setCat] = useState("All");
  const { blogPosts } = useSiteData();
  const ref = useReveal([cat, blogPosts.length]);
  const heroRef = useReveal();
  const featuredRef = useReveal([blogPosts.length]);
  const visible = cat === "All" ? blogPosts : blogPosts.filter(p => p.category === cat);
  const featured = blogPosts[0];
  return (
    <>
      <section ref={heroRef} className="pt-40 pb-14 max-w-[1240px] mx-auto px-6">
        <div className="reveal">
          <p className="text-blue text-sm font-medium mb-4">Blog</p>
          <h1 className="font-display text-4xl md:text-5xl font-semibold text-ink leading-[1.1]">Notes on marketing, design & growth.</h1>
        </div>
      </section>
      {featured && (
        <section ref={featuredRef} className="max-w-[1240px] mx-auto px-6 pb-16">
          <a href={"#/blog/"+featured.slug} onClick={()=>goTo("#/blog/"+featured.slug)} className="reveal group grid md:grid-cols-2 gap-8 items-center rounded-3xl border border-line overflow-hidden bg-white hover:shadow-xl hover:shadow-blue/10 transition-shadow duration-300">
            <MediaBox image={featured.image} seedIndex={1} className="aspect-[16/10] md:aspect-auto md:h-full transition-transform duration-500 group-hover:scale-[1.02]" />
            <div className="p-8 md:p-10">
              <p className="text-[11.5px] text-blue font-medium">{featured.category} · {featured.date}</p>
              <h2 className="font-display text-2xl font-semibold text-ink mt-3 leading-snug">{featured.title}</h2>
              <p className="text-[14px] text-ink/55 mt-3 leading-relaxed">{featured.excerpt}</p>
              <span className="mt-6 flex items-center gap-1.5 text-[13.5px] text-ink font-medium">Read article <Icon name="arrowRight" size={14} className="group-hover:translate-x-1 transition-transform" /></span>
            </div>
          </a>
        </section>
      )}
      <section className="max-w-[1240px] mx-auto px-6 pb-8 flex flex-wrap gap-2">
        {["All", ...BLOG_CATEGORIES].map(c => (
          <button key={c} onClick={()=>setCat(c)} className={"px-4 py-2 rounded-full text-[13.5px] border transition " + (cat===c ? "bg-blue text-white border-blue" : "border-line text-ink/60 hover:border-blue/40 hover:text-blue")}>{c}</button>
        ))}
      </section>
      <section ref={ref} className="max-w-[1240px] mx-auto px-6 pb-28 grid sm:grid-cols-2 lg:grid-cols-3 gap-8">
        {visible.map((p,i) => (
          <a key={p.slug} href={"#/blog/"+p.slug} onClick={()=>goTo("#/blog/"+p.slug)} className="reveal group block" style={{transitionDelay:(i*40)+"ms"}}>
            <MediaBox image={p.image} seedIndex={i} className="aspect-[4/3] rounded-2xl transition-transform duration-500 group-hover:scale-[1.03]" />
            <p className="text-[11.5px] text-blue font-medium mt-4">{p.category} · {p.date}</p>
            <h3 className="font-display text-[16px] font-semibold text-ink mt-2 leading-snug">{p.title}</h3>
            <p className="text-[13.5px] text-ink/50 mt-2 leading-relaxed">{p.excerpt}</p>
          </a>
        ))}
      </section>
    </>
  );
}
function BlogPostPage({ slug }) {
  const { blogPosts } = useSiteData();
  const p = blogPosts.find(x => x.slug === slug);
  const ref = useReveal([slug]);
  if (!p) return <div className="pt-40 pb-28 max-w-[760px] mx-auto px-6"><p>Article not found.</p></div>;
  const html = React.useMemo(() => {
    try { return window.marked ? window.marked.parse(p.body || "") : (p.body||"").replace(/\n/g,"<br/>"); }
    catch(e) { return p.body || ""; }
  }, [p.body]);
  return (
    <section ref={ref} className="pt-40 pb-28 max-w-[760px] mx-auto px-6">
      <a href="#/blog" onClick={()=>goTo('#/blog')} className="text-[13.5px] text-ink/50 hover:text-ink flex items-center gap-1.5 mb-8"><Icon name="arrowRight" size={13} className="rotate-180" /> Back to blog</a>
      <div className="reveal">
        <p className="text-blue text-sm font-medium mb-3">{p.category} · {p.date}</p>
        <h1 className="font-display text-3xl md:text-4xl font-semibold text-ink leading-[1.15]">{p.title}</h1>
      </div>
      <MediaBox image={p.image} seedIndex={2} className="reveal w-full aspect-[16/9] rounded-2xl my-10" style={{transitionDelay:"100ms"}} />
      <div className="reveal prose-hisky" style={{transitionDelay:"180ms"}} dangerouslySetInnerHTML={{ __html: html }}></div>
    </section>
  );
}

/* ============================== PAGE: CONTACT ============================== */
function encodeForm(data) {
  return Object.keys(data).map(k => encodeURIComponent(k) + "=" + encodeURIComponent(data[k])).join("&");
}
function ContactPage() {
  const { settings } = useSiteData();
  const contact = settings.contact || DEFAULTS.settings.contact;
  const [sent, setSent] = useState(false);
  const [sending, setSending] = useState(false);
  const [error, setError] = useState("");
  const [services, setServices] = useState([]);
  const [budget, setBudget] = useState("");
  const ref = useReveal();
  const toggle = (s) => setServices(services.includes(s) ? services.filter(x=>x!==s) : [...services, s]);
  const budgets = ["Under $500","$500–$1,000","$1,000–$2,500","$2,500+"];

  function handleSubmit(e) {
    e.preventDefault();
    setSending(true); setError("");
    const form = e.target;
    const payload = {
      "form-name": "contact",
      name: form.name.value,
      company: form.company.value,
      email: form.email.value,
      phone: form.phone.value,
      website: form.website.value,
      services: services.join(", "),
      budget: budget,
      message: form.message.value,
    };
    fetch("/", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: encodeForm(payload),
    }).then(() => setSent(true))
      .catch(() => setError("Something went wrong sending this — please email us directly instead."))
      .finally(() => setSending(false));
  }

  return (
    <section ref={ref} className="pt-40 pb-28 max-w-[1240px] mx-auto px-6 grid lg:grid-cols-[1fr_1.2fr] gap-16">
      <div className="reveal-left">
        <p className="text-blue text-sm font-medium mb-4">Contact</p>
        <h1 className="font-display text-4xl font-semibold text-ink leading-[1.1]">Let's talk about your project.</h1>
        <p className="mt-5 text-ink/60 text-[16px] leading-relaxed">Tell us what you're trying to achieve and we'll help you figure out the right next step.</p>
        <div className="mt-10 space-y-5">
          <div className="flex items-center gap-3 text-[14.5px] text-ink/70"><Icon name="mail" size={17} className="text-blue" /> {contact.email}</div>
          <div className="flex items-center gap-3 text-[14.5px] text-ink/70"><Icon name="phone" size={17} className="text-blue" /> {contact.phone}</div>
          <div className="flex items-center gap-3 text-[14.5px] text-ink/70"><Icon name="pin" size={17} className="text-blue" /> {contact.address}</div>
          <div className="flex items-center gap-3 text-[14.5px] text-ink/70"><Icon name="clock" size={17} className="text-blue" /> {contact.hours}</div>
        </div>
      </div>
      <div className="reveal-right bg-white border border-line rounded-3xl p-8 md:p-10" style={{transitionDelay:"100ms"}}>
        {sent ? (
          <div className="py-10 text-center">
            <span className="w-14 h-14 rounded-full bg-blue-mist text-blue flex items-center justify-center mx-auto"><Icon name="check" size={22} /></span>
            <h2 className="font-display text-xl font-semibold text-ink mt-5">Brief sent</h2>
            <p className="text-[14.5px] text-ink/55 mt-2">Thanks — we'll follow up shortly.</p>
          </div>
        ) : (
          <form onSubmit={handleSubmit} className="space-y-5">
            <div className="grid sm:grid-cols-2 gap-5">
              <Field label="Name" name="name" required />
              <Field label="Company" name="company" />
            </div>
            <div className="grid sm:grid-cols-2 gap-5">
              <Field label="Email" name="email" type="email" required />
              <Field label="Phone / WhatsApp" name="phone" />
            </div>
            <Field label="Website" name="website" />
            <div>
              <p className="text-[13px] font-medium text-ink/70 mb-2.5">Services needed</p>
              <div className="flex flex-wrap gap-2">
                {SERVICES.map(s => (
                  <button type="button" key={s.slug} onClick={()=>toggle(s.title)} className={"px-3.5 py-2 rounded-full text-[12.5px] border transition " + (services.includes(s.title) ? "bg-blue text-white border-blue" : "border-line text-ink/60")}>{s.title}</button>
                ))}
                <button type="button" onClick={()=>toggle("Twitch & YouTube Graphics")} className={"px-3.5 py-2 rounded-full text-[12.5px] border transition " + (services.includes("Twitch & YouTube Graphics") ? "bg-blue text-white border-blue" : "border-line text-ink/60")}>Twitch & YouTube Graphics</button>
              </div>
            </div>
            <div>
              <p className="text-[13px] font-medium text-ink/70 mb-2.5">Budget</p>
              <div className="flex flex-wrap gap-2">
                {budgets.map(b => (
                  <button type="button" key={b} onClick={()=>setBudget(b)} className={"px-3.5 py-2 rounded-full text-[12.5px] border transition " + (budget===b ? "bg-blue text-white border-blue" : "border-line text-ink/60")}>{b}</button>
                ))}
              </div>
            </div>
            <div>
              <label className="text-[13px] font-medium text-ink/70 block mb-2">Project details</label>
              <textarea name="message" rows="4" className="w-full border border-line rounded-xl px-4 py-3 text-[14.5px] focus:border-blue outline-none" placeholder="What are you trying to achieve?"></textarea>
            </div>
            {error && <p className="text-[13px] text-red-600">{error}</p>}
            <Button type="submit" className="w-full justify-center">{sending ? "Sending…" : "Send project brief"}</Button>
          </form>
        )}
      </div>
    </section>
  );
}
function Field({ label, name, type="text", required }) {
  return (
    <div>
      <label className="text-[13px] font-medium text-ink/70 block mb-2">{label}{required && <span className="text-blue"> *</span>}</label>
      <input type={type} name={name} required={required} className="w-full border border-line rounded-xl px-4 py-3 text-[14.5px] focus:border-blue outline-none" />
    </div>
  );
}

/* ============================== ROUTER / APP ============================== */
function NotFound() {
  return (
    <section className="pt-48 pb-28 max-w-[800px] mx-auto px-6 text-center">
      <h1 className="font-display text-3xl font-semibold text-ink">Page not found</h1>
      <Button href="#/" onClick={()=>goTo('#/')} className="mt-8">Back to home</Button>
    </section>
  );
}
function AppInner() {
  const hash = useHashRoute();
  const path = hash.replace(/^#/, "") || "/";
  const parts = path.split("/").filter(Boolean);

  let page;
  if (parts.length === 0) page = <HomePage />;
  else if (parts[0] === "services" && parts.length === 1) page = <ServicesOverviewPage />;
  else if (parts[0] === "services" && parts.length === 2) page = <ServiceDetailPage slug={parts[1]} />;
  else if (parts[0] === "twitch-youtube-graphics") page = <CreatorGraphicsPage />;
  else if (parts[0] === "portfolio" && parts.length === 1) page = <PortfolioPage />;
  else if (parts[0] === "portfolio" && parts.length === 2) page = <ProjectDetailPage slug={parts[1]} />;
  else if (parts[0] === "case-studies") page = <CaseStudiesPage />;
  else if (parts[0] === "about") page = <AboutPage />;
  else if (parts[0] === "blog" && parts.length === 1) page = <BlogPage />;
  else if (parts[0] === "blog" && parts.length === 2) page = <BlogPostPage slug={parts[1]} />;
  else if (parts[0] === "contact") page = <ContactPage />;
  else page = <NotFound />;

  return (
    <div className="min-h-screen flex flex-col">
      <ScrollProgressBar />
      <Navbar />
      <main className="flex-1"><div key={path} className="route-fade">{page}</div></main>
      <Footer />
    </div>
  );
}
function App() {
  return <DataProvider><AppInner /></DataProvider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
